[project]
name = "face-expression-recognition"
version = "0.1.0"
description = "人脸表情识别软件的设计与实现（课程设计）"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "opencv-python>=4.9,<5.0",
    "pyqt5>=5.15.9",
    "pyqt5-qt5==5.15.2",
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scikit-image>=0.24",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "pillow>=10.4",
]

# PyTorch CUDA 12.6 轮子（适配 RTX 4050）。如需改回 CPU 版：
# 把下面的 url 换成 https://download.pytorch.org/whl/cpu
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
